<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Vibrant Claude Gradient -->
    <linearGradient id="claudeGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffb088" />
      <stop offset="50%" stop-color="#d97757" />
      <stop offset="100%" stop-color="#9c4a2f" />
    </linearGradient>
    
    <!-- Soft Drop Shadow for Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#d97757" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <path fill="url(#claudeGrad)" 
        filter="url(#glow)" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linejoin="round" 
        d="M50 4 l6 28 25-13 -18 23 34 8 -34 8 18 23 -25-13 -6 28 -6-28 -25 13 18-23 -34-8 34-8 -18-23 25 13 z" />
</svg>
